name: CI

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink needs full history

      - name: Setup .NET (multi-version)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RockwellTagReader.csproj

      - name: Build
        run: dotnet build RockwellTagReader.csproj -c Release --no-restore

      # Tests will plug in here once added.
      # - name: Test
      #   run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack RockwellTagReader.csproj -c Release --no-build -o ./artifacts

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.*nupkg
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: nuget   # protects the secret behind a manual approval gate (optional)

    steps:
      - name: Download nupkg artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
